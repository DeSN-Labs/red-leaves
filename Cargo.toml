[workspace]
members = ["crates/protocol", "crates/node"]
default-members = ["crates/node"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
red-leaves-protocol = { path = "crates/protocol" }
libp2p = { version = "0.56.0", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio"] }
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
siwe = { version = "0.6.1", default-features = false }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
prost = "0.14"
ciborium = "0.2"
serde_bytes = "0.11"
thiserror = "2"
libp2p-core = "0.43.2"
libp2p-identity = { version = "0.2.14", features = ["ed25519", "peerid", "rand"] }
multiaddr = "0.18"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
aes-gcm = "0.10"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand09 = { package = "rand", version = "0.9" }
zeroize = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
alloy-sol-types = "1.6"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
tracing-appender = "0.2"
