[package]
name = "red-leaves"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["nas"]
nas = [
    "dep:sqlx", "sqlx/sqlite", "dep:axum", "dep:tokio", "dep:serde",
    "dep:siwe", "dep:rand", "dep:sha2", "dep:hex", "dep:time", "dep:tower-http", "dep:dotenvy",
]
relay = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-rustls-ring"]

[dependencies]
red-leaves-protocol.workspace = true
libp2p.workspace = true
sqlx = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
siwe = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
time = { workspace = true, optional = true }

tower-http = { workspace = true, optional = true }

dotenvy = { workspace = true, optional = true }

[dev-dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
